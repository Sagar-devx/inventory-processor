server:
  port: 0

spring:
  application:
    name: inventory-processor-test
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:inventory_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
  flyway:
    enabled: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
  processing:
    batch-size: 100
    max-concurrency: 5
    temp-dir: ./target/test-uploads

logging:
  level:
    root: INFO
    com.medical.inventory: DEBUG
